<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Програмування на Java — Курс</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="header__inner">
      <div class="header__logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
      </div>
      <div>
        <div class="header__title">Програмування на Java</div>
        <div class="header__subtitle">Java Programming Course</div>
      </div>
      <button class="theme-toggle" id="theme-toggle" title="Змінити тему" aria-label="Змінити тему">
        <svg class="theme-toggle__moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <svg class="theme-toggle__sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
      </button>
    </div>
  </header>

  <section class="hero">
    <div class="hero__badge">2026 / 2027</div>
    <h1 class="hero__title">Програмування<br>на Java</h1>
    <p class="hero__desc">Матеріали курсу — від класів та об’єктів до багатопоточності й сервлетів</p>
  </section>

  <main class="main">
    <h2 class="section-title">Лекції</h2>
    <div class="grid" id="lectures-grid"></div>

    <h2 class="section-title">Лабораторні роботи</h2>
    <div class="grid" id="labs-grid"></div>
  </main>

  <footer class="footer">
    Курс "Програмування на Java" • 2025/2026
  </footer>

  <script>

    const LABS_REPO = 'https://java-univer-2025.github.io';

    // status: 'ready' | 'draft' | 'self-study'
    const LECTURES = [
      { num: '1',  title: 'Вступ. Класи та об\'єкти',
        desc: 'Класи та об\'єкти • Створення об\'єктів • Пакети • Наслідування • Модифікатори доступу',
        href: 'pdfs/java_lec1.pdf' },

      { num: '2',  title: 'Modern Java: Records, Switch Expressions',
        desc: 'Switch expression • Enum • Record • equals, hashCode',
        href: 'pdfs/java_lec2.pdf' },

      { num: '3',  title: 'Обробка виключень',
        desc: 'Ієрархія Throwable • Checked vs Unchecked • Error vs Exception • Try-with-resources • Best practices',
        href: 'pdfs/java_lec3.pdf' },

      { num: '4',  title: 'Логування та юніт-тестування',
        desc: 'Рівні логування • Log4j, SLF4J, Logback • JUnit • Mockito',
        href: 'pdfs/java_lec4.pdf' },

      { num: '5',  title: 'Інтерфейси',
        href: 'https://javainterface.netlify.app' },

      { num: '6',  title: 'Generics, Collections, Functional Interface',
        href: 'https://javalecture5.netlify.app' },

      { num: '7',  title: 'Stream API',
        href: 'https://stream-api-presentation.netlify.app' },

      { num: '8',  title: 'Gradle та серіалізація',
        desc: 'Gradle • Serialization • Deserialization • Properties',
        href: './presentations/serialization/' },

      { num: '9',  title: 'Анотації та валідація',
        desc: 'Анотації • Валідація • Hibernate Validator',
        href: './presentations/validation/' },

      { num: '10', title: 'Багатопоточність та Concurrency',
        desc: 'Threads • ExecutorService • CompletableFuture',
        href: './presentations/parallel/' },

      { num: '11', title: 'Патерни створення об\'єктів',
        desc: 'Factory Methods • Builder Pattern • Lombok',
        href: './presentations/builder/' },

      { num: '12', title: 'Java Servlets',
        desc: 'HTTP • Request/Response • Життєвий цикл • Сесії',
        href: './presentations/servlet/' },
    ];

    const LABS = [
      { id: 'lab-00', num: '0',  title: 'Синтаксис Java. Налаштування середовища', score: 4 },
      { id: 'lab-01', num: '1',  title: 'Основи Java та модифікатори доступу', score: 9 },
      { id: 'lab-02', num: '2',  title: 'Enum, Record та Switch-case', score: 7 },
      { id: 'lab-03', num: '3',  title: 'Обробка виключень та юніт-тестування', score: 10 },
      { id: 'lab-04', num: '4',  title: 'Generics та Collections', score: 11 },
      { id: 'lab-05', num: '5',  title: 'Сортування. Comparator / Comparable', score: 9 },
      { id: 'lab-06', num: '6',  title: 'Stream API', score: 10 },
      { id: 'lab-07', num: '7',  title: 'Серіалізація та робота з файлами', score: 10 },
      { id: 'lab-08', num: '8',  title: 'Валідація даних', score: 10 },
      { id: 'lab-09', num: '9',  title: 'Багатопоточність та Concurrency', score: 9 },
      { id: 'lab-10', num: '10', title: 'Servlets та REST API', score: 11 },
    ];

    // ================================================================

    (function renderLectures() {
      const grid = document.getElementById('lectures-grid');

      grid.innerHTML = LECTURES.map((l, i) => {
        const delay = `animation-delay:${(i + 1) * 0.02}s`;
        const desc = l.desc ? `<div class="card__desc">${l.desc}</div>` : '';

        if (l.status === 'draft' || !l.href) {
          return `
            <div class="card card--disabled" style="${delay}">
              <div class="card__num">${l.num}</div>
              <div class="card__body">
                <div class="card__title">${l.title}</div>
                <div class="card__status">В розробці</div>
              </div>
            </div>`;
        }

        const external = /^https?:/.test(l.href);
        const selfStudy = l.status === 'self-study';

        return `
          <a class="card${selfStudy ? ' card--self-study' : ''}" href="${l.href}"
             ${external ? 'target="_blank" rel="noopener"' : ''} style="${delay}">
            <div class="card__num">${l.num}</div>
            <div class="card__body">
              <div class="card__title">${l.title}</div>
              ${selfStudy ? '<div class="card__tag">★ Самостійне вивчення</div>' : ''}
              ${desc}
            </div>
          </a>`;
      }).join('');
    })();

    (function renderLabs() {
      const grid = document.getElementById('labs-grid');

      grid.innerHTML = LABS.map((lab, i) => {
        const delay = `animation-delay:${(i + 1) * 0.02}s`;
        return `
          <a class="card" href="${LABS_REPO}/blob/main/${lab.id}/README.md"
             target="_blank" rel="noopener" style="${delay}">
            <div class="card__score" title="${lab.score} балів">${lab.score}</div>
            <div class="card__num">${lab.num}</div>
            <div class="card__body">
              <div class="card__title">${lab.title}</div>
            </div>
          </a>`;
      }).join('');
    })();

    (function themeToggle() {
      const toggle = document.getElementById('theme-toggle');
      const saved = localStorage.getItem('theme');
      if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');

      toggle.addEventListener('click', () => {
        const isLight = document.documentElement.getAttribute('data-theme') === 'light';
        if (isLight) {
          document.documentElement.removeAttribute('data-theme');
          localStorage.setItem('theme', 'dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
          localStorage.setItem('theme', 'light');
        }
      });
    })();
  </script>

</body>
</html>
